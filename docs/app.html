<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>freeFinder Wien - Gratis Deals & Angebote</title>
    <meta name="description" content="Die besten kostenlosen Deals und Angebote in Wien - täglich aktualisiert!">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
        }
        
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: #667eea;
        }
        
        .stats {
            display: flex;
            gap: 1rem;
            font-size: 0.9rem;
            color: #666;
        }
        
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        .filters {
            background: rgba(255, 255, 255, 0.95);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .filter-btn {
            padding: 0.5rem 1rem;
            border: 2px solid #ddd;
            background: white;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        
        .filter-btn:hover, .filter-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }
        
        .search-box {
            flex: 1;
            min-width: 250px;
            padding: 0.7rem 1rem;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 1rem;
        }
        
        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .deals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }
        
        .deal-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 1.5rem;
            position: relative;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        
        .deal-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        
        .deal-header {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .deal-logo {
            font-size: 2rem;
            margin-right: 1rem;
        }
        
        .deal-brand {
            font-weight: bold;
            color: #667eea;
            font-size: 1.1rem;
        }
        
        .deal-badges {
            position: absolute;
            top: 1rem;
            right: 1rem;
            display: flex;
            gap: 0.5rem;
        }
        
        .badge {
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .badge-gratis {
            background: #4CAF50;
            color: white;
        }
        
        .badge-rabatt {
            background: #FF9800;
            color: white;
        }
        
        .badge-hot {
            background: #F44336;
            color: white;
            animation: pulse 2s infinite;
        }
        
        .badge-new {
            background: #9C27B0;
            color: white;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        
        .deal-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: #333;
        }
        
        .deal-description {
            color: #666;
            margin-bottom: 1rem;
            line-height: 1.5;
        }
        
        .deal-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #888;
            border-top: 1px solid #eee;
            padding-top: 1rem;
        }
        
        .deal-location {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        
        .deal-expires {
            font-weight: 500;
        }
        
        .loading {
            text-align: center;
            padding: 3rem;
            font-size: 1.2rem;
            color: rgba(255,255,255,0.8);
        }
        
        .no-results {
            text-align: center;
            padding: 3rem;
            color: rgba(255,255,255,0.8);
            font-size: 1.1rem;
        }
        
        @media (max-width: 768px) {
            .deals-grid {
                grid-template-columns: 1fr;
            }
            
            .header-content {
                flex-direction: column;
                gap: 1rem;
            }
            
            .filters {
                flex-direction: column;
                align-items: stretch;
            }
            
            .search-box {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">🎯 freeFinder Wien</div>
            <div class="stats">
                <span id="total-deals">Lade...</span>
                <span id="last-updated">Lade...</span>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="filters">
            <input type="text" class="search-box" placeholder="Suche nach Deals..." id="search">
            <button class="filter-btn active" data-filter="all">Alle</button>
            <button class="filter-btn" data-filter="gratis">Gratis</button>
            <button class="filter-btn" data-filter="essen">Essen</button>
            <button class="filter-btn" data-filter="kaffee">Kaffee</button>
            <button class="filter-btn" data-filter="beauty">Beauty</button>
            <button class="filter-btn" data-filter="wien">Wien</button>
            <button class="filter-btn" data-filter="hot">🔥 Hot</button>
        </div>

        <div id="deals-container">
            <div class="loading">🔄 Lade die neuesten Wien Deals...</div>
        </div>
    </div>

    <script>
        let allDeals = [];
        let filteredDeals = [];
        let currentFilter = 'all';
        let searchTerm = '';

        // Load deals data
        async function loadDeals() {
            try {
                const response = await fetch('deals.json');
                const data = await response.json();
                allDeals = data.deals || [];
                
                // Update stats
                document.getElementById('total-deals').textContent = `${data.totalDeals} Deals`;
                const lastUpdate = new Date(data.lastUpdated).toLocaleString('de-AT');
                document.getElementById('last-updated').textContent = `Zuletzt: ${lastUpdate}`;
                
                filteredDeals = allDeals;
                renderDeals();
            } catch (error) {
                document.getElementById('deals-container').innerHTML = 
                    '<div class="no-results">❌ Fehler beim Laden der Deals</div>';
            }
        }

        // Render deals
        function renderDeals() {
            const container = document.getElementById('deals-container');
            
            if (filteredDeals.length === 0) {
                container.innerHTML = '<div class="no-results">🔍 Keine Deals gefunden</div>';
                return;
            }

            const html = filteredDeals.map(deal => `
                <div class="deal-card" onclick="openDeal('${deal.url}')">
                    <div class="deal-badges">
                        ${deal.type === 'gratis' ? '<span class="badge badge-gratis">Gratis</span>' : ''}
                        ${deal.type === 'rabatt' ? '<span class="badge badge-rabatt">Rabatt</span>' : ''}
                        ${deal.hot ? '<span class="badge badge-hot">Hot</span>' : ''}
                        ${deal.isNew ? '<span class="badge badge-new">Neu</span>' : ''}
                    </div>
                    
                    <div class="deal-header">
                        <div class="deal-logo">${deal.logo}</div>
                        <div class="deal-brand">${deal.brand}</div>
                    </div>
                    
                    <div class="deal-title">${deal.title}</div>
                    <div class="deal-description">${deal.description}</div>
                    
                    <div class="deal-footer">
                        <div class="deal-location">
                            📍 ${deal.distance}
                        </div>
                        <div class="deal-expires">
                            ⏰ ${deal.expires}
                        </div>
                    </div>
                </div>
            `).join('');
            
            container.innerHTML = `<div class="deals-grid">${html}</div>`;
        }

        // Filter deals
        function filterDeals() {
            filteredDeals = allDeals.filter(deal => {
                // Search filter
                if (searchTerm) {
                    const searchMatch = 
                        deal.title.toLowerCase().includes(searchTerm) ||
                        deal.description.toLowerCase().includes(searchTerm) ||
                        deal.brand.toLowerCase().includes(searchTerm);
                    if (!searchMatch) return false;
                }
                
                // Category filter
                if (currentFilter === 'all') return true;
                if (currentFilter === 'hot') return deal.hot;
                if (currentFilter === 'gratis') return deal.type === 'gratis';
                return deal.category === currentFilter;
            });
            
            renderDeals();
        }

        // Open deal URL
        function openDeal(url) {
            if (url && url !== '#') {
                window.open(url, '_blank');
            }
        }

        // Event listeners
        document.getElementById('search').addEventListener('input', (e) => {
            searchTerm = e.target.value.toLowerCase();
            filterDeals();
        });

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelector('.filter-btn.active').classList.remove('active');
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                filterDeals();
            });
        });

        // Initialize
        loadDeals();
        
        // Auto-refresh every 30 minutes
        setInterval(loadDeals, 30 * 60 * 1000);
    </script>
</body>
</html>
